name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: git archive --format=zip -o watchtower-action-release.zip HEAD action.yml src LICENSE README.md
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'watchtower-action-release.zip'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" watchtower-action-release.zip --generate-notes --verify-tag
