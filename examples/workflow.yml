# Copy to .github/workflows/deploy.yml in your app repository.
name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the commit range
      - run: npm ci && npm run build
      - uses: watchtowerobservability/watchtower-action-release@v0
        env:
          WT_AUTH_TOKEN: ${{ secrets.WT_AUTH_TOKEN }}
        with:
          project: ${{ vars.WT_PROJECT }}
          environment: production
          sourcemaps: dist
          url_prefix: '~/static'
